<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-6 text-slate-900">

    <!-- Logo & Tagline Header -->
    <div class="text-center mb-8">
        <div class="flex items-center justify-center gap-2 mb-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                <i data-lucide="zap" class="w-6 h-6"></i>
            </div>
            <span class="text-2xl font-bold tracking-tight text-slate-900">GROUP 3</span>
        </div>
        <p class="text-slate-500 font-medium">Join the conversation today.</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden">
        <div class="p-8 md:p-10">
            <h1 class="text-2xl font-bold text-slate-900 mb-6 text-center">Create your account</h1>

            <form id="signupForm" class="space-y-5" onsubmit="event.preventDefault(); validateForm();">
                
                <!-- Full Name -->
                <div>
                    <label for="fullname" class="block text-sm font-medium text-slate-700 mb-1.5">Full Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="user" class="w-5 h-5"></i>
                        </div>
                        <input type="text" id="fullname" name="fullname" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder-slate-400 text-sm" placeholder="e.g. Alex Rivera">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                        </div>
                        <input type="email" id="email" name="email" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder-slate-400 text-sm" placeholder="name@example.com">
                    </div>
                    <!-- Subtle validation hint -->
                    <p class="mt-1.5 text-xs text-slate-500">We'll never share your email with anyone else.</p>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </div>
                        <input type="password" id="password" name="password" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder-slate-400 text-sm" placeholder="Create a password">
                    </div>
                    <!-- Inline validation hints container -->
                    <ul class="mt-2 space-y-1">
                        <li class="text-xs text-slate-500 flex items-center gap-1.5">
                            <div class="w-1.5 h-1.5 rounded-full bg-slate-300" id="hint-length-dot"></div>
                            <span id="hint-length-text">Must be at least 8 characters</span>
                        </li>
                    </ul>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-1.5">Confirm Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </div>
                        <input type="password" id="confirm_password" name="confirm_password" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder-slate-400 text-sm" placeholder="Repeat password">
                    </div>
                    <!-- Error message placeholder (hidden by default) -->
                    <p id="match-error" class="mt-1.5 text-xs text-red-500 hidden flex items-center gap-1">
                        <i data-lucide="alert-circle" class="w-3 h-3"></i> Passwords do not match
                    </p>
                </div>

                <!-- Action Buttons -->
                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3.5 rounded-xl hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200 transform active:scale-[0.98] flex items-center justify-center gap-2">
                        Sign Up
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Footer Link -->
        <div class="bg-slate-50 px-8 py-6 border-t border-slate-100 text-center">
            <p class="text-sm text-slate-600">
                Already have an account? 
                <a href="#" class="text-indigo-600 font-semibold hover:text-indigo-700 transition-colors hover:underline">Log in</a>
            </p>
        </div>
    </div>
    
    <div class="mt-8 flex items-center justify-center gap-6 text-sm text-slate-400">
        <a href="#" class="hover:text-slate-600 transition-colors">Privacy</a>
        <a href="#" class="hover:text-slate-600 transition-colors">Terms</a>
        <a href="#" class="hover:text-slate-600 transition-colors">Help</a>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Simple Validation Script for interactivity
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');
        const hintLengthDot = document.getElementById('hint-length-dot');
        const hintLengthText = document.getElementById('hint-length-text');
        const matchError = document.getElementById('match-error');

        // Live password strength hint
        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (val.length >= 8) {
                hintLengthDot.classList.replace('bg-slate-300', 'bg-green-500');
                hintLengthText.classList.replace('text-slate-500', 'text-green-600');
            } else {
                hintLengthDot.classList.replace('bg-green-500', 'bg-slate-300');
                hintLengthText.classList.replace('text-green-600', 'text-slate-500');
            }
        });

        // Simple form validation on submit
        function validateForm() {
            const p1 = passwordInput.value;
            const p2 = confirmInput.value;
            let valid = true;

            // Reset styles
            confirmInput.classList.remove('border-red-500', 'focus:border-red-500', 'focus:ring-red-500/10');
            matchError.classList.add('hidden');

            if (p1 !== p2) {
                // Show error state
                confirmInput.classList.add('border-red-500', 'focus:border-red-500', 'focus:ring-red-500/10');
                confirmInput.classList.remove('border-slate-200', 'focus:border-indigo-500');
                matchError.classList.remove('hidden');
                // Re-init icons because we unhid an element containing an icon
                lucide.createIcons();
                valid = false;
            }

            if (valid) {
                // Simulate success (e.g. change button text)
                const btn = document.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                btn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> Creating Account...`;
                lucide.createIcons();
                setTimeout(() => {
                    btn.innerHTML = `<i data-lucide="check" class="w-5 h-5"></i> Welcome!`;
                    lucide.createIcons();
                    btn.classList.replace('bg-indigo-600', 'bg-green-600');
                    btn.classList.replace('shadow-indigo-200', 'shadow-green-200');
                }, 1500);
            }
        }
    </script>
</body>
</html>
