<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Pulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Simple float animation for the right side visual */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .animate-float {
            animation: float 8s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-white h-screen w-full flex overflow-hidden">

    <!-- Left Side: Login Form -->
    <div class="w-full lg:w-1/2 flex flex-col justify-center p-8 md:p-16 xl:p-24 relative z-10 bg-white">
        
        <!-- Logo (Top Left absolute for mobile, inline for desktop) -->
        <div class="absolute top-8 left-8 lg:static lg:mb-12 flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white">
                <i data-lucide="zap" class="w-5 h-5"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-slate-900">GROUP 3</span>
        </div>

        <div class="max-w-sm w-full mx-auto">
            
            <!-- Header -->
            <div class="mb-10">
                <h1 class="text-3xl font-bold text-slate-900 mb-2">Welcome back</h1>
                <p class="text-slate-500">Please enter your details to sign in.</p>
            </div>

            <!-- Form -->
            <form class="space-y-5" onsubmit="event.preventDefault();">
                
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                        </div>
                        <input type="email" id="email" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder-slate-400 text-sm" placeholder="Enter your email">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-5 h-5"></i>
                        </div>
                        <input type="password" id="password" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all placeholder-slate-400 text-sm" placeholder="••••••••">
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                        <span class="text-sm text-slate-600 group-hover:text-slate-900 transition-colors">Remember me</span>
                    </label>
                    <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-700 transition-colors">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button class="w-full bg-indigo-600 text-white font-semibold py-3.5 rounded-xl hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200 transform active:scale-[0.98] flex items-center justify-center gap-2">
                    Log In
                </button>

                <!-- Google Auth Button (Optional Polish) -->
                <button class="w-full bg-white text-slate-700 font-medium py-3.5 rounded-xl border border-slate-200 hover:bg-slate-50 transition-all flex items-center justify-center gap-2">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                    Sign in with Google
                </button>

            </form>

            <!-- Footer -->
            <p class="text-center mt-8 text-sm text-slate-500">
                Don't have an account? 
                <a href="#" class="font-semibold text-indigo-600 hover:text-indigo-700">Sign up</a>
            </p>

            <!-- Secure Badge -->
            <div class="mt-12 flex items-center justify-center gap-2 text-xs text-slate-400 uppercase tracking-wider font-medium">
                <i data-lucide="shield-check" class="w-4 h-4 text-green-500"></i>
                Secure Authentication
            </div>

        </div>
    </div>

    <!-- Right Side: Visual/Preview -->
    <div class="hidden lg:block lg:w-1/2 relative bg-slate-50 overflow-hidden">
        <!-- Background shapes -->
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-50 to-blue-100"></div>
        <div class="absolute top-1/4 right-1/4 w-96 h-96 bg-indigo-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
        <div class="absolute bottom-1/4 left-1/4 w-96 h-96 bg-pink-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>

        <!-- Mockup Content -->
        <div class="absolute inset-0 flex items-center justify-center animate-float">
            <!-- Glassmorphism Card -->
            <div class="w-[400px] bg-white/60 backdrop-blur-xl border border-white/50 p-6 rounded-3xl shadow-2xl shadow-indigo-500/10 transform rotate-[-2deg]">
                
                <!-- Fake Post Header -->
                <div class="flex items-center gap-3 mb-4">
                    <div class="relative">
                         <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="w-12 h-12 rounded-full bg-white shadow-sm border-2 border-white">
                         <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
                    </div>
                    <div>
                        <div class="h-4 w-24 bg-slate-800/10 rounded mb-1.5"></div>
                        <div class="h-3 w-16 bg-slate-800/5 rounded"></div>
                    </div>
                    <div class="ml-auto">
                        <div class="w-8 h-8 bg-white/50 rounded-full flex items-center justify-center text-slate-400">
                            <i data-lucide="more-horizontal" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>

                <!-- Fake Post Body -->
                <div class="space-y-2 mb-4">
                    <div class="h-3 w-full bg-slate-800/5 rounded"></div>
                    <div class="h-3 w-full bg-slate-800/5 rounded"></div>
                    <div class="h-3 w-2/3 bg-slate-800/5 rounded"></div>
                </div>

                <!-- Fake Image -->
                <div class="h-48 w-full bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl mb-4 flex items-center justify-center text-white/20">
                    <i data-lucide="image" class="w-12 h-12"></i>
                </div>

                <!-- Fake Action Bar -->
                <div class="flex items-center justify-between pt-2">
                    <div class="flex gap-4">
                        <div class="w-8 h-8 rounded-full bg-white/50 flex items-center justify-center text-slate-400">
                             <i data-lucide="heart" class="w-4 h-4"></i>
                        </div>
                        <div class="w-8 h-8 rounded-full bg-white/50 flex items-center justify-center text-slate-400">
                             <i data-lucide="message-circle" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <div class="w-20 h-3 bg-slate-800/5 rounded-full"></div>
                </div>
            </div>
            
            <!-- Floating Elements around card -->
            <div class="absolute -right-12 top-20 bg-white p-3 rounded-2xl shadow-lg animate-bounce" style="animation-duration: 3s;">
                <i data-lucide="heart" class="w-6 h-6 text-pink-500 fill-current"></i>
            </div>
            <div class="absolute -left-8 bottom-32 bg-white p-3 rounded-2xl shadow-lg animate-bounce" style="animation-duration: 4s;">
                <i data-lucide="message-circle" class="w-6 h-6 text-indigo-500 fill-current"></i>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
